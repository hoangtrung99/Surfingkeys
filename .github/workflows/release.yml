name: Release

# Builds the Chromium package and publishes it as a release, attached as
# surfingkeys-palette-<tag>.zip. Two ways in:
# - push a v* tag: the release takes its title and notes from the tag's message
#   (git tag -a); a lightweight tag gets GitHub's generated notes instead.
# - Run workflow (Actions tab) with a new tag name: the tag is created on the
#   commit this run built, with the title and notes given there.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: New tag to release, e.g. v1.19.2-palette.5
        required: true
      title:
        description: Release title (the tag when empty)
        required: false
      notes:
        description: Release notes in Markdown (generated when empty)
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
    - name: npm install and build
      run: |
        npm install
        npm run build
      env:
        CI: true
    - name: publish
      env:
        GH_TOKEN: ${{ github.token }}
        # inputs reach the script only through the environment: written into
        # the script itself, a crafted title or note would run as shell code
        TAG: ${{ inputs.tag || github.ref_name }}
        TITLE: ${{ inputs.title }}
        NOTES: ${{ inputs.notes }}
      run: |
        if ! printf '%s' "$TAG" | grep -Eq '^v[0-9A-Za-z._-]+$'; then
          echo "not a release tag: $TAG" >&2
          exit 1
        fi
        asset="surfingkeys-palette-$TAG.zip"
        cp dist/production/chrome/sk.zip "$asset"
        if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
          set -- --target "$GITHUB_SHA" --title "${TITLE:-$TAG}"
          if [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" > notes.md
            set -- "$@" --notes-file notes.md
          else
            set -- "$@" --generate-notes
          fi
        else
          # checkout fetches the tag as a bare ref: fetch the tag object itself,
          # or an annotated tag reads as lightweight and its notes are lost
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          if [ "$(git cat-file -t "$TAG")" = tag ]; then
            title="$(git tag -l --format='%(contents:subject)' "$TAG")"
            git tag -l --format='%(contents:body)' "$TAG" > notes.md
            set -- --verify-tag --title "${title:-$TAG}" --notes-file notes.md
          else
            set -- --verify-tag --title "$TAG" --generate-notes
          fi
        fi
        gh release create "$TAG" "$asset" "$@"
