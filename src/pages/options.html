<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Surfingkeys Settings</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="../content.css">
        <link rel="stylesheet" href="settings.css">
        <!-- the picked theme's colours, set by options/shell.js -->
        <style id="sk_settings_tokens"></style>
        <script src="ace.js" type="text/javascript" charset="utf-8"></script>
    </head>
    <body>
        <a class="sk-skip" href="#settingsMain">Skip to settings</a>
        <header class="sk-header">
            <div class="sk-brand">
                <img src="../icons/48.png" alt="" width="28" height="28">
                <h1>Surfingkeys</h1>
                <span class="sk-version" id="settingsVersion"></span>
            </div>
            <div class="sk-find">
                <label class="sk-vh" for="settingsFilter">Find a setting</label>
                <input type="search" id="settingsFilter" placeholder="Find a setting" autocomplete="off" spellcheck="false">
            </div>
            <a class="sk-mode" id="settingsMode" href="#advanced" title="Settings mode: change it in Advanced">Basic mode</a>
        </header>
        <div class="sk-layout">
            <nav class="sk-nav" id="settingsNav" aria-label="Settings"><ul></ul></nav>
            <main class="sk-main" id="settingsMain" tabindex="-1">
                <p class="sk-muted" id="settingsNoMatch" hidden></p>
            </main>
        </div>
        <div class="sk-vh" id="settingsStatus" role="status" aria-live="polite"></div>
        <script type="text/plain" id="sample">// an example to create a new mapping `ctrl-y`
api.mapkey('<Ctrl-y>', 'Show me the money', function() {
    api.Front.showPopup('a well-known phrase uttered by characters in the 1996 film Jerry Maguire (Escape to close).');
});

// an example to replace `T` with `gt`, click `Default mappings` to see how `T` works.
api.map('gt', 'T');

// an example to remove mapkey `Ctrl-i`
api.unmap('<Ctrl-i>');

// set theme
settings.theme = `
.sk_theme {
    font-family: Input Sans Condensed, Charcoal, sans-serif;
    font-size: 10pt;
    background: #24272e;
    color: #abb2bf;
}
.sk_theme tbody {
    color: #fff;
}
.sk_theme input {
    color: #d0d0d0;
}
.sk_theme .url {
    color: #61afef;
}
.sk_theme .annotation {
    color: #56b6c2;
}
.sk_theme .omnibar_highlight {
    color: #528bff;
}
.sk_theme .omnibar_timestamp {
    color: #e5c07b;
}
.sk_theme .omnibar_visitcount {
    color: #98c379;
}
.sk_theme #sk_omnibarSearchResult ul li:nth-child(odd) {
    background: #303030;
}
.sk_theme #sk_omnibarSearchResult ul li.focused {
    background: #3e4452;
}
#sk_status, #sk_find {
    font-size: 20pt;
}`;
// click `Save` button to make above settings to take effect.</script>
        <script src="../content.js"></script>
    </body>
</html>
